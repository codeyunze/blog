label="github" target="_blank" rel="noopener" data-v-95a4d926 data-v-86a99ffc><span class="vpi-social-github" /></a><!--]--></div></div></div><!--]--><!--]--></div></div></div><!--[--><!--]--><button type="button" class="vp-navbar-hamburger hamburger" aria-label="mobile navigation" aria-expanded="false" aria-controls="nav-screen" data-v-b88a6553 data-v-ace2769d><span class="container" data-v-ace2769d><span class="top" data-v-ace2769d></span><span class="middle" data-v-ace2769d></span><span class="bottom" data-v-ace2769d></span></span></button></div></div></div></div><div class="divider" data-v-b88a6553><div class="divider-line" data-v-b88a6553></div></div></div><!----></header><!----><!----><!--[--><div id="VPContent" vp-content class="vp-content" data-v-0f45c45d data-v-334cc006><div class="vp-blog" vp-blog data-v-334cc006 data-v-4c7df08f><!--[--><!--]--><div class="blog-container" data-v-4c7df08f><!----><div class="vp-blog-post-list" data-v-4c7df08f data-v-04e47dec><!--[--><!--]--><!--[--><template><div class="vp-blog-post-item" data-allow-mismatch data-v-04e47dec data-v-1e0b35c8><!----><div class="blog-post-item-content" data-v-1e0b35c8><h3 data-v-1e0b35c8><!----><!----><a class="vp-link no-icon link" href="/article/xspeczii/" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->Java状态机案例Demo<!--]--><!----></a></h3><div class="post-meta" data-v-1e0b35c8><div class="category-list" data-v-1e0b35c8><span class="icon vpi-folder" data-v-1e0b35c8></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=93f725" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->java<!--]--><!----></a><!----><!--]--><!--]--></div><!----><div class="create-time" data-v-1e0b35c8><span class="icon vpi-clock" data-v-1e0b35c8></span><span data-v-1e0b35c8>2026-04-09</span></div></div><div class="vp-doc excerpt" data-v-1e0b35c8><p>「状态机 = 规则」 + 「Action = 业务」 + 「Service = 编排」</p>
<ul>
<li>
<p>限制状态的更新，制定好规则，例：只能从状态A变更为状态B和状态C，只能从状态B变更为状态D，如果直接从状态A变更为状态D，则报错。</p>
</li>
<li>
<p>状态的变更是由每一个Event事件决定的，每个事件所对应的业务逻辑会由各自独立的Action去进行实现。</p>
</li>
<li>
<p>流程编排：连接「状态机规则」与「事件业务实现」的枢纽，用于管理事件Event与业务Action的关联关系。</p>
</li>
</ul>
<div class="language- line-numbers-mode" data-ext="" data-title=""><button class="copy" title="复制代码" data-copied="已复制"></button><pre class="shiki shiki-themes vitesse-light vitesse-dark vp-code" v-pre=""><code><span class="line"><span>private</span><span class="space"> </span><span>final</span><span class="space"> </span><span>Map&#x3C;OrderEvent,</span><span class="space"> </span><span>OrderEventAction></span><span class="space"> </span><span>actions;</span></span></code></pre>

<div class="line-numbers" aria-hidden="true" style="counter-reset:line-number 0"><div class="line-number"></div></div></div></div></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-04e47dec data-v-1e0b35c8><!----><div class="blog-post-item-content" data-v-1e0b35c8><h3 data-v-1e0b35c8><!----><!----><a class="vp-link no-icon link" href="/article/zkxidzry/" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->解决PowerShell无法执行pnpm命令<!--]--><!----></a></h3><div class="post-meta" data-v-1e0b35c8><div class="category-list" data-v-1e0b35c8><span class="icon vpi-folder" data-v-1e0b35c8></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=795f32" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->other<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-1e0b35c8><span class="icon vpi-tag" data-v-1e0b35c8></span><!--[--><a class="vp-link no-icon link tag vp-tag-boba" href="/blog/tags/?tag=问题解决方案" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->问题解决方案<!--]--><!----></a><!--]--></div><div class="create-time" data-v-1e0b35c8><span class="icon vpi-clock" data-v-1e0b35c8></span><span data-v-1e0b35c8>2026-04-06</span></div></div><div class="vp-doc excerpt" data-v-1e0b35c8><p>在PowerShell中执行pnpm命令时，可能会遇到以下错误：</p>
<div class="language- line-numbers-mode" data-ext="" data-title=""><button class="copy" title="复制代码" data-copied="已复制"></button><pre class="shiki shiki-themes vitesse-light vitesse-dark vp-code" v-pre=""><code><span class="line"><span>pnpm</span><span class="space"> </span><span>:</span><span class="space"> </span><span>无法加载文件</span><span class="space"> </span><span>C:\Users\用户名\AppData\Roaming\npm\pnpm.ps1，因为在此系统上禁止运行脚本。</span></span></code></pre>

<div class="line-numbers" aria-hidden="true" style="counter-reset:line-number 0"><div class="line-number"></div></div></div><p>这是由于PowerShell的执行策略（Execution Policy）限制导致的。默认情况下，PowerShell会阻止运行本地脚本文件，以防止恶意脚本的执行。</p>
</div></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-04e47dec data-v-1e0b35c8><!----><div class="blog-post-item-content" data-v-1e0b35c8><h3 data-v-1e0b35c8><!----><!----><a class="vp-link no-icon link" href="/article/a2bad019/" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->Mac系统SublimeText快捷键速查表<!--]--><!----></a></h3><div class="post-meta" data-v-1e0b35c8><div class="category-list" data-v-1e0b35c8><span class="icon vpi-folder" data-v-1e0b35c8></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=795f32" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->other<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-1e0b35c8><span class="icon vpi-tag" data-v-1e0b35c8></span><!--[--><a class="vp-link no-icon link tag vp-tag-oigb" href="/blog/tags/?tag=手册" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->手册<!--]--><!----></a><a class="vp-link no-icon link tag vp-tag-pugq" href="/blog/tags/?tag=工具" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->工具<!--]--><!----></a><!--]--></div><div class="create-time" data-v-1e0b35c8><span class="icon vpi-clock" data-v-1e0b35c8></span><span data-v-1e0b35c8>2026-03-31</span></div></div><!----></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-04e47dec data-v-1e0b35c8><!----><div class="blog-post-item-content" data-v-1e0b35c8><h3 data-v-1e0b35c8><!----><!----><a class="vp-link no-icon link" href="/article/ugn7pzeo/" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->MySQL备份工具分享（五）：多线程备份<!--]--><!----></a></h3><div class="post-meta" data-v-1e0b35c8><div class="category-list" data-v-1e0b35c8><span class="icon vpi-folder" data-v-1e0b35c8></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=795f32" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->other<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-1e0b35c8><span class="icon vpi-tag" data-v-1e0b35c8></span><!--[--><a class="vp-link no-icon link tag vp-tag-pugq" href="/blog/tags/?tag=工具" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->工具<!--]--><!----></a><a class="vp-link no-icon link tag vp-tag-r44k" href="/blog/tags/?tag=数据库" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->数据库<!--]--><!----></a><a class="vp-link no-icon link tag vp-tag-h2tx" href="/blog/tags/?tag=多线程" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->多线程<!--]--><!----></a><!--]--></div><div class="create-time" data-v-1e0b35c8><span class="icon vpi-clock" data-v-1e0b35c8></span><span data-v-1e0b35c8>2026-03-30</span></div></div><div class="vp-doc excerpt" data-v-1e0b35c8><p>从单用户工具迈向可登录、多账号隔离的平台；备份底层换 mydumper，全量/增量与任务调度分模块承载，持久化结构更清晰，Docker 一键部署即可用。</p>
</div></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-04e47dec data-v-1e0b35c8><!----><div class="blog-post-item-content" data-v-1e0b35c8><h3 data-v-1e0b35c8><!----><!----><a class="vp-link no-icon link" href="/article/rjdkvkgd/" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->Elasticsearch客户端连接资源未释放导致系统提示500异常<!--]--><!----></a></h3><div class="post-meta" data-v-1e0b35c8><div class="category-list" data-v-1e0b35c8><span class="icon vpi-folder" data-v-1e0b35c8></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=795f32" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->other<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-1e0b35c8><span class="icon vpi-tag" data-v-1e0b35c8></span><!--[--><a class="vp-link no-icon link tag vp-tag-boba" href="/blog/tags/?tag=问题解决方案" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->问题解决方案<!--]--><!----></a><a class="vp-link no-icon link tag vp-tag-fl1n" href="/blog/tags/?tag=Elasticsearch" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->Elasticsearch<!--]--><!----></a><!--]--></div><div class="create-time" data-v-1e0b35c8><span class="icon vpi-clock" data-v-1e0b35c8></span><span data-v-1e0b35c8>2026-03-19</span></div></div><div class="vp-doc excerpt" data-v-1e0b35c8><p>线上曾出现 Gateway 返回 500/502，堆与数据库未见异常，jstack 显示大量线程在等待 ES 连接。根因多为 ES 客户端使用不当（连接占用/释放不对称、频繁新建与关闭客户端）。通过 ElasticsearchClientManager 以单例 ElasticsearchClient、统一连接池与启动预热，业务统一经 getClient 访问 ES，收敛连接耗尽与接口延迟抖动。</p>
</div></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-04e47dec data-v-1e0b35c8><!----><div class="blog-post-item-content" data-v-1e0b35c8><h3 data-v-1e0b35c8><!----><!----><a class="vp-link no-icon link" href="/article/2239ucb3/" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->MySQL备份工具分享（四）：定时增量备份<!--]--><!----></a></h3><div class="post-meta" data-v-1e0b35c8><div class="category-list" data-v-1e0b35c8><span class="icon vpi-folder" data-v-1e0b35c8></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=795f32" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->other<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-1e0b35c8><span class="icon vpi-tag" data-v-1e0b35c8></span><!--[--><a class="vp-link no-icon link tag vp-tag-pugq" href="/blog/tags/?tag=工具" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->工具<!--]--><!----></a><a class="vp-link no-icon link tag vp-tag-r44k" href="/blog/tags/?tag=数据库" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->数据库<!--]--><!----></a><!--]--></div><div class="create-time" data-v-1e0b35c8><span class="icon vpi-clock" data-v-1e0b35c8></span><span data-v-1e0b35c8>2026-03-17</span></div></div><div class="vp-doc excerpt" data-v-1e0b35c8><p>在前几篇分享中，我们已经把“按需全量备份 + 手动增量备份 + Web 可视化还原 + 实例信息 + 任务调度”等能力铺好地基。</p>
<p>这一篇要讲的，数据备份的最后一块拼图，定时增量备份：</p>
<blockquote>
<p><strong>在固定时间自动跑全量备份后，让后续的增量备份也能自动、连续、可追溯地跑起来。</strong></p>
</blockquote>
<p>本次分享介绍的就是：<strong>定时增量备份</strong> 功能，以及它和 <strong>定时全量备份</strong> 之间的精细关联。</p>
</div></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-04e47dec data-v-1e0b35c8><!----><div class="blog-post-item-content" data-v-1e0b35c8><h3 data-v-1e0b35c8><!----><!----><a class="vp-link no-icon link" href="/article/bgfj2a07/" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->MySQL备份工具分享（三）：定时全量备份<!--]--><!----></a></h3><div class="post-meta" data-v-1e0b35c8><div class="category-list" data-v-1e0b35c8><span class="icon vpi-folder" data-v-1e0b35c8></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=795f32" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->other<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-1e0b35c8><span class="icon vpi-tag" data-v-1e0b35c8></span><!--[--><a class="vp-link no-icon link tag vp-tag-pugq" href="/blog/tags/?tag=工具" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->工具<!--]--><!----></a><a class="vp-link no-icon link tag vp-tag-r44k" href="/blog/tags/?tag=数据库" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->数据库<!--]--><!----></a><!--]--></div><div class="create-time" data-v-1e0b35c8><span class="icon vpi-clock" data-v-1e0b35c8></span><span data-v-1e0b35c8>2026-03-14</span></div></div><div class="vp-doc excerpt" data-v-1e0b35c8><p>在前两篇分享中，我们介绍了全量备份、增量备份以及通过 Web 界面进行备份与恢复的操作。</p>
<p>本篇介绍本阶段新增的两个能力：<strong>数据库实例信息</strong> 与 <strong>任务调度</strong>。</p>
<p>前者用于集中管理多套数据库连接配置，在操作备份与还原时，无需再重复填写数据库的连接信息。任务调度则用于基于这些实例配置定时全量备份任务（增量定时备份还在开发中），由系统 crontab 按 cron 表达式自动执行。</p>
<blockquote>
<p>注意：因为工具内涉及到的都是数据库相关敏感信息与数据，所以建议该工具在内网安全环境使用，以防数据库连接信息与备份数据泄露。（后续会逐步开发相关安全校验功能）</p>
</blockquote>
</div></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-04e47dec data-v-1e0b35c8><!----><div class="blog-post-item-content" data-v-1e0b35c8><h3 data-v-1e0b35c8><!----><!----><a class="vp-link no-icon link" href="/article/drdtmc7q/" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->MySQL备份工具分享（二）：增量备份<!--]--><!----></a></h3><div class="post-meta" data-v-1e0b35c8><div class="category-list" data-v-1e0b35c8><span class="icon vpi-folder" data-v-1e0b35c8></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=795f32" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->other<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-1e0b35c8><span class="icon vpi-tag" data-v-1e0b35c8></span><!--[--><a class="vp-link no-icon link tag vp-tag-pugq" href="/blog/tags/?tag=工具" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->工具<!--]--><!----></a><a class="vp-link no-icon link tag vp-tag-r44k" href="/blog/tags/?tag=数据库" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->数据库<!--]--><!----></a><!--]--></div><div class="create-time" data-v-1e0b35c8><span class="icon vpi-clock" data-v-1e0b35c8></span><span data-v-1e0b35c8>2026-03-11</span></div></div><div class="vp-doc excerpt" data-v-1e0b35c8><p>在上一篇分享中，我们介绍了这款 MySQL 数据库备份工具的全量备份能力：智能大表拆分、结构与数据分离、表过滤、Web 可视化界面等。</p>
<p>本篇在此基础上，专门介绍 <strong>本次新增的增量备份功能</strong> ：如何在全量备份之后形成连续的增量链，如何恢复“全量 + 若干增量”到指定时间点的数据状态，以及使用时的注意事项。</p>
</div></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-04e47dec data-v-1e0b35c8><!----><div class="blog-post-item-content" data-v-1e0b35c8><h3 data-v-1e0b35c8><!----><!----><a class="vp-link no-icon link" href="/article/byidcs90/" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->MySQL备份工具分享（一）：可视化操作备份与还原<!--]--><!----></a></h3><div class="post-meta" data-v-1e0b35c8><div class="category-list" data-v-1e0b35c8><span class="icon vpi-folder" data-v-1e0b35c8></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=795f32" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->other<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-1e0b35c8><span class="icon vpi-tag" data-v-1e0b35c8></span><!--[--><a class="vp-link no-icon link tag vp-tag-pugq" href="/blog/tags/?tag=工具" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->工具<!--]--><!----></a><a class="vp-link no-icon link tag vp-tag-r44k" href="/blog/tags/?tag=数据库" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->数据库<!--]--><!----></a><!--]--></div><div class="create-time" data-v-1e0b35c8><span class="icon vpi-clock" data-v-1e0b35c8></span><span data-v-1e0b35c8>2026-02-28</span></div></div><div class="vp-doc excerpt" data-v-1e0b35c8><p>在日常的数据库管理中，备份是一项至关重要的工作。一个好的备份工具不仅能保证数据安全，还能提高工作效率。</p>
</div></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-04e47dec data-v-1e0b35c8><!----><div class="blog-post-item-content" data-v-1e0b35c8><h3 data-v-1e0b35c8><!----><!----><a class="vp-link no-icon link" href="/article/gajc3rqz/" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->curl 命令操作详尽指南<!--]--><!----></a></h3><div class="post-meta" data-v-1e0b35c8><div class="category-list" data-v-1e0b35c8><span class="icon vpi-folder" data-v-1e0b35c8></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=3c78b3" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->manual<!--]--><!----></a><!----><!--]--><!--]--></div><!----><div class="create-time" data-v-1e0b35c8><span class="icon vpi-clock" data-v-1e0b35c8></span><span data-v-1e0b35c8>2026-02-12</span></div></div><div class="vp-doc excerpt" data-v-1e0b35c8><p><code v-pre>curl</code> 是一个强大的命令行工具，用于在服务器之间传输数据。它支持多种协议（HTTP、HTTPS、FTP、SFTP、LDAP 等），尤其擅长发送和接收 <strong>HTTP/HTTPS 请求</strong>。</p>
</div></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-04e47dec data-v-1e0b35c8><!----><div class="blog-post-item-content" data-v-1e0b35c8><h3 data-v-1e0b35c8><!----><!----><a class="vp-link no-icon link" href="/article/2hle9f2o/" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->中间件安全检查知识<!--]--><!----></a></h3><div class="post-meta" data-v-1e0b35c8><div class="category-list" data-v-1e0b35c8><span class="icon vpi-folder" data-v-1e0b35c8></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=795f32" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->other<!--]--><!----></a><!----><!--]--><!--]--></div><!----><div class="create-time" data-v-1e0b35c8><span class="icon vpi-clock" data-v-1e0b35c8></span><span data-v-1e0b35c8>2026-01-20</span></div></div><div class="vp-doc excerpt" data-v-1e0b35c8><p>中间件是应用系统的核心组件，常暴露于网络中，容易成为攻击者的目标。以下总结了常见中间件的安全风险及加固建议，涵盖 <strong>Nacos、Redis、ElasticSearch、RabbitMQ、Tomcat、Nginx、Rancher</strong> 等。</p>
</div></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-04e47dec data-v-1e0b35c8><!----><div class="blog-post-item-content" data-v-1e0b35c8><h3 data-v-1e0b35c8><!----><!----><a class="vp-link no-icon link" href="/article/f6bus4cr/" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->策略模式<!--]--><!----></a></h3><div class="post-meta" data-v-1e0b35c8><!----><!----><div class="create-time" data-v-1e0b35c8><span class="icon vpi-clock" data-v-1e0b35c8></span><span data-v-1e0b35c8>2026-01-16</span></div></div><!----></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-04e47dec data-v-1e0b35c8><!----><div class="blog-post-item-content" data-v-1e0b35c8><h3 data-v-1e0b35c8><!----><!----><a class="vp-link no-icon link" href="/article/xhww0bx3/" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->Mac多版本jdk管理<!--]--><!----></a></h3><div class="post-meta" data-v-1e0b35c8><div class="category-list" data-v-1e0b35c8><span class="icon vpi-folder" data-v-1e0b35c8></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=3c78b3" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->manual<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-1e0b35c8><span class="icon vpi-tag" data-v-1e0b35c8></span><!--[--><a class="vp-link no-icon link tag vp-tag-oigb" href="/blog/tags/?tag=手册" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->手册<!--]--><!----></a><!--]--></div><div class="create-time" data-v-1e0b35c8><span class="icon vpi-clock" data-v-1e0b35c8></span><span data-v-1e0b35c8>2026-01-07</span></div></div><div class="vp-doc excerpt" data-v-1e0b35c8><p>在 <code v-pre>mac os</code> 系统管理多个不同版本的jdk环境，实现灵活切换。</p>
</div></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-04e47dec data-v-1e0b35c8><!----><div class="blog-post-item-content" data-v-1e0b35c8><h3 data-v-1e0b35c8><!----><!----><a class="vp-link no-icon link" href="/article/nawr706a/" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->窗口函数ROW_NUMBER<!--]--><!----></a></h3><div class="post-meta" data-v-1e0b35c8><div class="category-list" data-v-1e0b35c8><span class="icon vpi-folder" data-v-1e0b35c8></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=11e0ee" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->database<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-1e0b35c8><span class="icon vpi-tag" data-v-1e0b35c8></span><!--[--><a class="vp-link no-icon link tag vp-tag-r44k" href="/blog/tags/?tag=数据库" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->数据库<!--]--><!----></a><a class="vp-link no-icon link tag vp-tag-n9w1" href="/blog/tags/?tag=MySQL" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->MySQL<!--]--><!----></a><!--]--></div><div class="create-time" data-v-1e0b35c8><span class="icon vpi-clock" data-v-1e0b35c8></span><span data-v-1e0b35c8>2026-01-04</span></div></div><div class="vp-doc excerpt" data-v-1e0b35c8><p>ROW_NUMBER() OVER实战：优雅实现分组取最新记录，一行代码搞定学生最新成绩查询。</p>
</div></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-04e47dec data-v-1e0b35c8><!----><div class="blog-post-item-content" data-v-1e0b35c8><h3 data-v-1e0b35c8><!----><!----><a class="vp-link no-icon link" href="/article/z712x92h/" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->API接口加密认证<!--]--><!----></a></h3><div class="post-meta" data-v-1e0b35c8><div class="category-list" data-v-1e0b35c8><span class="icon vpi-folder" data-v-1e0b35c8></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=93f725" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->java<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-1e0b35c8><span class="icon vpi-tag" data-v-1e0b35c8></span><!--[--><a class="vp-link no-icon link tag vp-tag-iuh4" href="/blog/tags/?tag=理论" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->理论<!--]--><!----></a><a class="vp-link no-icon link tag vp-tag-oigb" href="/blog/tags/?tag=手册" data-v-1e0b35c8 data-v-3a9f60f0><!--[-->手册<!--]--><!----></a><!--]--></div><div class="create-time" data-v-1e0b35c8><span class="icon vpi-clock" data-v-1e0b35c8></span><span data-v-1e0b35c8>2026-01-03</span></div></div><div class="vp-doc excerpt" data-v-1e0b35c8><p>采用 <strong>SM2非对称加密 + SM4对称加密 + SM3摘要签名</strong> 的国密算法组合，确保API调用的安全性。</p>
<p>SM2数字签名，用于验证数据上传对象是否合法，是否是在服务端备案的客户端。</p>
<p>SM4对称加密业务数据：将客户端上传的业务数据进行加密，防止业务数据明文暴露出去。</p>
<p>SM3消息摘要签名：对业务数据进行hash计算，生成摘要签名，防止业务数据被人篡改。</p>
</div></div></div></template><!--]--><!--[--><!--]--><div class="vp-blog-pagination" data-v-04e47dec data-v-236a5476><button type="button" class="btn prev" disabled data-v-236a5476>上一页</button><div class="page-range" data-v-236a5476><!--[--><button class="active btn" type="button" data-v-236a5476>1</button><button class="btn" type="button" data-v-236a5476>2</button><button class="btn" type="button" data-v-236a5476>3</button><button class="btn" type="button" data-v-236a5476>4</button><button class="btn" type="button" data-v-236a5476>5</button><button class="btn" type="button" data-v-236a5476>6</button><!--]--></div><button type="button" class="btn next" data-v-236a5476>下一页</button></div><!--[--><!--]--></div><div class="vp-blog-aside" data-v-4c7df08f data-v-3e343ddb><!--[--><!--]--><div class="vp-blog-profile" data-v-3e343ddb data-v-3610f330><p class="" data-v-3610f330><img src="/images/Snipaste_2025-03-06_14-35-40.png" alt="云泽" data-v-3610f330></p><div class="profile-info" data-v-3610f330><h3 data-v-3610f330>云泽</h3><p data-v-3610f330>专注技术深耕与实战沉淀的开发者笔记</p><!----><!----></div><div class="profile-social" data-v-3610f330><div class="vp-social-links" data-v-3610f330 data-v-95a4d926><!--[--><a class="vp-social-link no-icon" href="https://github.com/codeyunze" aria-label="github" target="_blank" rel="noopener" data-v-95a4d926 data-v-86a99ffc><span class="vpi-social-github" /></a><a class="vp-social-link no-icon" href="/images/weixinpublic.png" aria-label="qq" target="_blank" rel="noopener" data-v-95a4d926 data-v-86a99ffc><span class="vpi-social-qq" /></a><!--]--></div></div></div><div class="vp-blog-nav" data-v-3e343ddb data-v-79388847><a class="vp-link no-icon link nav-link" href="/blog/tags/" data-v-79388847 data-v-3a9f60f0><!--[--><span class="icon icon-logo vpi-tag" data-v-79388847></span><span class="text" data-v-79388847>标签</span><span class="total" data-v-79388847>45</span><span class="icon vpi-chevron-right" data-v-79388847></span><!--]--><!----></a><a class="vp-li
